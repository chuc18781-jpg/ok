</html><!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanh toán - SHOP ACC PHÚCUONG</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:90%;
max-width:420px;
background:#1a1a1a;
border:2px solid red;
border-radius:15px;
padding:20px;
box-shadow:0 0 20px red;
}

h1{
text-align:center;
color:#ff2b2b;
text-shadow:0 0 10px red;
}

label{
display:block;
margin-top:12px;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#d60000;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff0000;
}

a{
color:#ff5555;
text-decoration:none;
display:block;
text-align:center;
margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>💳 Thanh Toán</h1>

<label>Loại thẻ</label>
<select>
<option>Viettel</option>
<option>Vinaphone</option>
<option>Mobifone</option>
</select>

<label>Mã thẻ</label>
<input type="text" placeholder="Nhập mã thẻ">

<label>Số seri</label>
<input type="text" placeholder="Nhập số seri">

<button>GỬI THẺ</button>

<a href="index.html">⬅ Quay lại Shop</a>

</div>

</body>
</html>
